name: Build Android APK
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'   # default 'tools platform-tools' fails: legacy 'tools' package no longer exists

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: android

      - name: Decode signing keystore (only if the secret is set)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build both editions
        working-directory: android
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Collect and sign APKs
        run: |
          set -euo pipefail
          mkdir -p out

          # Newest installed build-tools (zipalign + apksigner)
          if ! ls "$ANDROID_HOME"/build-tools/* >/dev/null 2>&1; then
            sdkmanager "build-tools;34.0.0" >/dev/null
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)

          # Signing key: your secrets if provided, otherwise a throwaway CI key
          if [ -n "${KEYSTORE_FILE:-}" ] && [ -f "${KEYSTORE_FILE:-}" ]; then
            KS="$KEYSTORE_FILE"; ALIAS="$KEY_ALIAS"
            export KS_PASS="$KEYSTORE_PASSWORD"
            export K_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          else
            echo "::warning::No keystore secrets set. Using a temporary key: each release gets a different signature, so users must uninstall before updating. Add KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets for stable updates."
            KS="$RUNNER_TEMP/ci.jks"; ALIAS="ci"
            export KS_PASS="ciPass123"; export K_PASS="ciPass123"
            keytool -genkeypair -keystore "$KS" -storepass "$KS_PASS" -keypass "$K_PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Neural Flow CI, O=NeuralSyntax"
          fi

          pack() {  # $1 = flavor, $2 = output file name
            src=$(find "android/app/build/outputs/apk/$1/release" -name '*.apk' 2>/dev/null | head -1 || true)
            if [ -z "$src" ]; then
              echo "::error::No $1 release APK found. APKs that were built:"
              find android -name '*.apk' || true
              exit 1
            fi
            echo "Found $1 APK: $src"
            case "$src" in
              *unsigned*)
                "$BT/zipalign" -p -f 4 "$src" "$RUNNER_TEMP/$1-aligned.apk"
                "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" \
                  --ks-pass env:KS_PASS --key-pass env:K_PASS \
                  --out "out/$2" "$RUNNER_TEMP/$1-aligned.apk"
                ;;
              *) cp "$src" "out/$2" ;;
            esac
            "$BT/apksigner" verify "out/$2"
          }

          pack full "Neural-Flow-Android-${TAG}.apk"
          pack lite "Neural-Flow-Android-Lite-${TAG}.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: neural-flow-apks
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
