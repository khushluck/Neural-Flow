name: Build Android APK
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
          build-root-directory: android

      - name: Decode signing keystore (only if the secret is set)
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build both editions
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Name the APKs
        run: |
          mkdir out
          cp android/app/build/outputs/apk/full/release/app-full-release.apk "out/Neural-Flow-Android-${{ github.ref_name }}.apk"
          cp android/app/build/outputs/apk/lite/release/app-lite-release.apk "out/Neural-Flow-Android-Lite-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: neural-flow-apks
          path: out/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
